<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Réservation - Le Domaine de Léa</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar">

<a href="/">Accueil</a>
<a href="/chalet">Le chalet</a>
<a href="/photos">Photos</a>
<a href="/tarifs">Tarifs</a>
<a href="/reservation">Réservation</a>
<a href="/supplements">Suppléments</a>
<a href="/actualites">Actualités</a>
<a href="/contact">Contact</a>
<a href="/panier">Panier</a>

</nav>

<img src="{{ url_for('static', filename='images/banniere.jpg') }}" class="banniere">

<div class="contenu">

<img src="{{ url_for('static', filename='images/logo.png') }}" class="logo">

<h1>Réserver votre séjour</h1>

<p class="slogan">

Choisissez vos dates et préparez votre séjour.

</p>

<form class="contact-form" method="POST">
<label>Date d'arrivée</label>

<input type="date" name="arrivee" required>

<label>Date de départ</label>

<input type="date" name="depart" required>

<label>Nombre d'adultes</label>

<select name="adultes">

<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>

</select>

<label>Nombre d'enfants</label>

<select name="enfants">

<option value="0">0</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>

</select>

<label>Nom</label>

<input type="text" name="nom" required>

<label>Prénom</label>

<input type="text" name="prenom" required>

<label>Téléphone</label>

<input type="tel" name="telephone" required>

<label>Adresse e-mail</label>

<input type="email" name="email" required>

<label>Message</label>

<textarea name="message" rows="6"></textarea>

<br>

<button type="submit">

Ajouter au panier

</button>

</form>

</div>

</body>

</html>
